version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement-setu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: placement_setu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - placement_setu_pgdata:/var/lib/postgresql/data

volumes:
  placement_setu_pgdata:
