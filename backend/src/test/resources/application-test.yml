spring:
  datasource:
    url: jdbc:h2:mem:placement_setu_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-min-32-chars
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  security:
    max-failed-login-attempts: 3
    account-lock-minutes: 15
  cors:
    allowed-origins: http://localhost:5173
