server:
  port: 8080

spring:
  application:
    name: placement-setu-backend

  # --- PostgreSQL (single database for the whole application) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:placement_setu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:11218830}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema. Hibernate must never auto-generate/alter tables.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- Resume upload limits (Resume Service) ---
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# --- Application-specific config ---
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_MIN_32_CHARACTERS_LONG}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    resume-dir: ${RESUME_STORAGE_DIR:./data/resumes}

# --- Gemini AI (Resume Service AI parsing) ---
gemini:
  api:
    key: Your_Actual_Key
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
