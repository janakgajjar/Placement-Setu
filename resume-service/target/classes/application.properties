# --- Database (H2 = a database that's just a file on your disk, no install needed) ---
spring.datasource.url=jdbc:h2:file:./data/resumedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Optional: lets you view the database in a browser at /h2-console
spring.h2.console.enabled=true

# --- File upload limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

